<!DOCTYPE html>
<html lang="si" dir="ltr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="ශ්‍රී ලාංකේය සිල්ලර කඩේ — අද දවසේ භාණ්ඩ මිල දර්ශනය" />
  <meta name="theme-color" content="#1a3d2b" />

  <!-- Open Graph / Social sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="කඩේ මිල දර්ශනය" />
  <meta property="og:description" content="අද දවසේ ග්‍රොසරි භාණ්ඩ මිල ගණන්" />

  <title>Grocery Price List</title>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Preconnect for font performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>

<body>

  <!-- ═══════════════════════════════════════════
       HEADER
  ═══════════════════════════════════════════ -->
  <header class="site-header" role="banner">
    <div class="header-inner">
      <div class="header-top">

        <!-- Shop Logo (Modern Eco-Grocery Icon) -->
        <div class="shop-logo" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
        </div>

        <!-- Shop name and subtitle (set by config.js) -->
        <div class="shop-name-block">
          <h1 id="shop-name">...පූරණය වෙමින්...</h1>
          <p id="shop-subtitle"></p>
        </div>

        <!-- Currency badge -->
        <div class="header-badge" aria-label="මිල ශ්‍රී ලංකා රුපියල් වලින්">
          <span class="currency-note">රු. LKR</span>
        </div>

      </div>

      <!-- Hint text -->
      <div class="header-info" role="note">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        <span>පහත සෙවීමෙන් භාණ්ඩයේ නම ලියා ඉක්මනින් මිල බලන්න</span>
      </div>

      <!-- Shop Contact Quick Actions -->
      <div class="shop-contact-bar">
        <a id="shop-call-btn" href="tel:0773441275" class="contact-pill call-pill" title="දුරකථන ඇමතුමක් ලබාගන්න">
          <span class="pill-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
          </span>
          <span id="shop-phone-display">077 344 1275</span>
        </a>
        <a id="shop-whatsapp-btn" href="https://wa.me/94773441275?text=%E0%B7%83%E0%B7%94%E0%B6%B6%20%E0%B6%AF%E0%B7%80%E0%B7%83%E0%B6%9A%E0%B7%8A%21%20%E0%B6%B7%E0%B7%8F%E0%B6%AB%E0%B7%8A%E0%B6%A9%20%E0%B6%B4%E0%B7%92%E0%B7%85%E0%B7%92%E0%B6%B6%E0%B6%B3%E0%B7%80%20%E0%B7%80%E0%B7%92%E0%B7%83%E0%B7%8A%E0%B6%AD%E0%B6%BB%20%E0%B6%AF%E0%B7%90%E0%B6%B1%20%E0%B6%9C%E0%B7%90%E0%B6%B1%E0%B7%93%E0%B6%A4%E0%B6%A7%20%E0%B6%85%E0%B7%80%E0%B7%87%E0%B7%81%E0%B7%8A%E0%B6%BA%E0%B6%BA%E0%B7%92." target="_blank" rel="noopener" class="contact-pill whatsapp-pill" title="WhatsApp මගින් විමසන්න">
          <span class="pill-icon wa-svg">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.711 2.598 2.669-.699c.969.53 1.771.82 2.791.82 3.181 0 5.767-2.587 5.768-5.766.001-3.182-2.585-5.806-5.768-5.806zm3.393 8.245c-.144.405-.837.774-1.17.824-.312.045-.694.075-1.119-.062-.266-.086-.607-.215-1.047-.406-1.849-.803-3.047-2.67-3.14-2.794-.093-.125-.751-.998-.751-1.903 0-.905.474-1.349.643-1.533.169-.184.37-.23.493-.23.123 0 .247.001.353.007.113.005.263-.043.412.316.155.372.531 1.297.577 1.39.046.093.077.201.015.324-.062.123-.093.2-.185.308-.093.108-.195.241-.278.324-.093.093-.19.194-.082.38.108.185.481.794 1.033 1.286.711.635 1.311.832 1.496.924.185.093.293.078.401-.046.108-.124.463-.54.586-.726.124-.185.247-.154.416-.092.17.062 1.079.509 1.264.602.185.093.308.139.354.216.046.077.046.448-.098.853zM12 2C6.477 2 2 6.477 2 12c0 1.891.524 3.662 1.435 5.179L2.05 22l4.982-1.306A9.957 9.957 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2zm0 18.167c-1.638 0-3.165-.487-4.444-1.325l-.319-.208-2.956.774.788-2.88-.228-.363a8.138 8.138 0 01-1.258-4.331C3.583 7.362 7.362 3.583 12 3.583c4.638 0 8.417 3.779 8.417 8.417 0 4.638-3.779 8.167-8.417 8.167z"/>
            </svg>
          </span>
          <span>WhatsApp ඇණවුම්</span>
        </a>
      </div>
    </div>
  </header>

  <!-- ═══════════════════════════════════════════
       SEARCH BAR (sticky)
  ═══════════════════════════════════════════ -->
  <section class="search-section" aria-label="භාණ්ඩ සෙවීම">
    <div class="search-wrapper">
      <div class="search-box">
        <!-- Search icon -->
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>

        <!-- Search input -->
        <input type="search" id="search-input" autocomplete="off" autocorrect="off" autocapitalize="off"
          spellcheck="false" inputmode="search" enterkeyhint="search" placeholder="භාණ්ඩයක් සොයන්න..."
          aria-label="භාණ්ඩ නාමය ඇතුළු කරන්න" aria-controls="product-grid" aria-describedby="result-count" />

        <!-- Clear button -->
        <button id="search-clear" type="button" aria-label="සෙවීම මකන්න" title="සෙවීම මකන්න">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
            stroke-linecap="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
    </div>
  </section>

  <!-- ═══════════════════════════════════════════
       MAIN CONTENT
  ═══════════════════════════════════════════ -->
  <main class="main-content" role="main">

    <!-- Toolbar: sort + result count -->
    <div class="toolbar" role="toolbar" aria-label="ගැලපුම් සහ වර්ගීකරණ">
      <span id="result-count" aria-live="polite" aria-atomic="true"></span>

      <div class="sort-group">
        <label for="sort-select" class="sort-label">වර්ග කිරීම:</label>
        <select id="sort-select" aria-label="වර්ගීකරණ ක්‍රමය">
          <option value="name">නම අනුව</option>
          <option value="price-asc">මිල — අඩු සිට</option>
          <option value="price-desc">මිල — වැඩි සිට</option>
        </select>
      </div>
    </div>

    <!-- Category filter chips -->
    <section class="category-section" aria-label="කාණ්ඩ ගැළපීම">
      <div id="category-bar" role="group" aria-label="කාණ්ඩ"></div>
    </section>

    <!-- ── Loading Skeletons ── -->
    <div id="skeleton-cards" aria-label="දත්ත පූරණය වෙමින්..." aria-busy="true">
      <!-- 8 skeleton cards generated below -->
      <div class="skeleton-card" aria-hidden="true">
        <div class="skeleton-line skeleton-icon"></div>
        <div class="skeleton-line skeleton-cat"></div>
        <div class="skeleton-line skeleton-name"></div>
        <div class="skeleton-line skeleton-name2"></div>
        <div class="skeleton-line skeleton-price"></div>
      </div>
      <div class="skeleton-card" aria-hidden="true">
        <div class="skeleton-line skeleton-icon"></div>
        <div class="skeleton-line skeleton-cat"></div>
        <div class="skeleton-line skeleton-name"></div>
        <div class="skeleton-line skeleton-name2"></div>
        <div class="skeleton-line skeleton-price"></div>
      </div>
      <div class="skeleton-card" aria-hidden="true">
        <div class="skeleton-line skeleton-icon"></div>
        <div class="skeleton-line skeleton-cat"></div>
        <div class="skeleton-line skeleton-name"></div>
        <div class="skeleton-line skeleton-name2"></div>
        <div class="skeleton-line skeleton-price"></div>
      </div>
      <div class="skeleton-card" aria-hidden="true">
        <div class="skeleton-line skeleton-icon"></div>
        <div class="skeleton-line skeleton-cat"></div>
        <div class="skeleton-line skeleton-name"></div>
        <div class="skeleton-line skeleton-name2"></div>
        <div class="skeleton-line skeleton-price"></div>
      </div>
      <div class="skeleton-card" aria-hidden="true">
        <div class="skeleton-line skeleton-icon"></div>
        <div class="skeleton-line skeleton-cat"></div>
        <div class="skeleton-line skeleton-name"></div>
        <div class="skeleton-line skeleton-name2"></div>
        <div class="skeleton-line skeleton-price"></div>
      </div>
      <div class="skeleton-card" aria-hidden="true">
        <div class="skeleton-line skeleton-icon"></div>
        <div class="skeleton-line skeleton-cat"></div>
        <div class="skeleton-line skeleton-name"></div>
        <div class="skeleton-line skeleton-name2"></div>
        <div class="skeleton-line skeleton-price"></div>
      </div>
      <div class="skeleton-card" aria-hidden="true">
        <div class="skeleton-line skeleton-icon"></div>
        <div class="skeleton-line skeleton-cat"></div>
        <div class="skeleton-line skeleton-name"></div>
        <div class="skeleton-line skeleton-name2"></div>
        <div class="skeleton-line skeleton-price"></div>
      </div>
      <div class="skeleton-card" aria-hidden="true">
        <div class="skeleton-line skeleton-icon"></div>
        <div class="skeleton-line skeleton-cat"></div>
        <div class="skeleton-line skeleton-name"></div>
        <div class="skeleton-line skeleton-name2"></div>
        <div class="skeleton-line skeleton-price"></div>
      </div>
    </div>

    <!-- ── Error State ── -->
    <div id="error-state" role="alert" aria-live="assertive">
      <div class="error-icon" aria-hidden="true">⚠️</div>
      <p id="error-msg">දත්ත ලබාගැනීමට නොහැකි විය.</p>
      <button id="retry-btn" class="btn-retry" type="button">නැවත උත්සාහ කරන්න</button>
    </div>

    <!-- ── Empty State ── -->
    <div id="empty-state" aria-live="polite">
      <div class="empty-icon" aria-hidden="true">🔍</div>
      <p id="empty-msg">භාණ්ඩ හමු නොවීය.</p>
    </div>

    <!-- ── Product Grid ── -->
    <div id="product-grid" role="list" aria-label="භාණ්ඩ ලැයිස්තුව" aria-live="polite"></div>

  </main>

  <!-- ═══════════════════════════════════════════
       FOOTER BAR
  ═══════════════════════════════════════════ -->
  <footer class="footer-bar" role="contentinfo">
    <div class="footer-top-row">
      <span id="last-updated" aria-label="අවසන් යාවත්කාලීනය"></span>
      <button id="refresh-btn" type="button" aria-label="නවතම මිල ගණන් ලබාගන්න">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="23 4 23 10 17 10" />
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
        </svg>
        නැවත ලබාගන්න
      </button>
    </div>

    <!-- Developer Credits Section -->
    <div class="developer-credits">
      <div class="dev-line">
        <span class="dev-icon">💻</span>
        <span class="dev-text">Developed by <strong>Ramesh Maduranga</strong></span>
      </div>
      <div class="dev-contact">
        <a href="tel:0774953035" class="dev-link" title="Call Developer">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
          <span>077 495 3035</span>
        </a>
        <span class="dev-dot">•</span>
        <a href="https://wa.me/94774953035" target="_blank" rel="noopener" class="dev-link dev-wa" title="WhatsApp Developer">
          <span>WhatsApp</span>
        </a>
      </div>
    </div>
  </footer>

  <!-- Back to top -->
  <button id="back-to-top" type="button" aria-label="ඉහළට යන්න" title="ඉහළට යන්න">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="18 15 12 9 6 15" />
    </svg>
  </button>

  <!-- ═══════════════════════════════════════════
       SCRIPTS (order matters)
  ═══════════════════════════════════════════ -->
  <script src="js/config.js"></script>
  <script src="js/data-service.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>

</body>

</html>
